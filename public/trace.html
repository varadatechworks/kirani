<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174c3c"><meta name="robots" content="noindex,nofollow">
<title>Kirani | Product trace</title>
<style>
:root{color-scheme:light;--green:#174c3c;--leaf:#9fc66b;--cream:#f7f6ef;--ink:#202b25;--muted:#718077;--line:#e6e9df;--paper:#fffefa}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:850px;margin:0 auto;padding:28px 18px 60px}.brand{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:850;letter-spacing:.2px}.mark{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-size:20px}.hero{margin:25px 0 18px}.eyebrow{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#6c8655;font-weight:800}.hero h1{font-size:clamp(27px,5vw,40px);line-height:1.12;letter-spacing:-1px;margin:8px 0}.hero p{color:var(--muted);margin:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px;margin-top:13px;box-shadow:0 12px 30px #243c2b0a}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.top h2{margin:0;font-size:18px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.pill{display:inline-flex;border-radius:99px;background:#eaf1df;color:var(--green);font-size:11px;font-weight:800;padding:6px 10px}.pill.bad{background:#fff0ed;color:#a33b2c}.items{display:grid;gap:9px;margin-top:13px}.item,.batch{padding:12px;border:1px solid var(--line);border-radius:12px}.item b,.batch b{display:block}.item small,.batch small{color:var(--muted)}.batch-list{display:grid;gap:9px;margin-top:13px}.batch{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.batch span{font-size:11px;color:var(--muted);text-align:right}.notice{background:#f1f4ea;border-radius:12px;padding:13px;color:#5c6b5e;font-size:12px}.actions{display:flex;gap:10px;margin-top:15px}.actions a,.actions button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;color:var(--green);font:inherit;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer}.loading{color:var(--muted);padding:22px 0}.error{color:#a33b2c}.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:22px}@media(max-width:520px){.wrap{padding:20px 13px 40px}.card{padding:15px}.batch{grid-template-columns:1fr}.batch span{text-align:left}}@media print{body{background:white}.wrap{padding:0;max-width:none}.actions,.foot{display:none}.card{box-shadow:none;break-inside:avoid}.hero{margin-top:16px}}
</style>
</head>
<body>
<main class="wrap">
 <div class="brand"><span class="mark">✦</span><span>KIRANI <small style="display:block;font-size:9px;letter-spacing:1.4px;color:#718077">FRESHNESS WITH A STORY</small></span></div>
 <header class="hero"><div class="eyebrow">From source to doorstep</div><h1>Product trace</h1><p>Explore the journey of the product batches packed for this order.</p></header>
 <div id="traceContent" class="loading" role="status" aria-live="polite">Loading verified trace information…</div>
 <div class="foot">Kirani publishes product and batch trace details while protecting farmer contact, private address and payment information.</div>
</main>
<script>
(()=>{const root=document.getElementById('traceContent');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'Not recorded';async function load(){const token=location.pathname.split('/').filter(Boolean).pop();if(!/^[0-9a-f-]{36}$/i.test(token||'')){root.innerHTML='<p class="error">This trace link is invalid.</p>';return;}try{const response=await fetch('/api/v1/public/trace/'+encodeURIComponent(token),{headers:{accept:'application/json'}});const payload=await response.json();if(!response.ok)throw new Error(payload.error?.message||'Trace information is unavailable.');const d=payload.data;root.innerHTML='<section class="card"><div class="top"><div><div class="eyebrow">Package identity</div><h2>'+esc(d.packageNumber)+'</h2><div class="meta">Packed '+esc(date(d.packedAt))+'</div></div><span class="pill '+(d.status==='RECALLED'?'bad':'')+'">'+esc(d.status)+'</span></div></section><section class="card"><h2>Inside this package</h2><div class="items">'+(d.items||[]).map(x=>'<div class="item"><b>'+esc(x.productName)+'</b><small>'+esc(x.sku)+' · '+esc(x.quantity)+' '+esc(x.unitCode)+'</small></div>').join('')+'</div></section><section class="card"><h2>Batch journey</h2><p class="meta">Source batches and processing lineage linked to the packed products.</p><div class="batch-list">'+(d.sourceBatches||[]).map(x=>'<div class="batch"><div><b>'+esc(x.batchCode)+' · '+esc(x.productName)+'</b><small>Receipt '+esc(x.receiptNumber||'Not available')+' · PO '+esc(x.purchaseOrder||'Not available')+'</small></div><span>'+esc(x.processingStages||'Goods receipt batch')+'</span></div>').join('')+'</div>'+(d.sourceBatches?.length?'':'<p class="meta">No source batch records are available for this package.</p>')+'</section><section class="card"><div class="notice">'+esc(d.disclosure)+'</div><div class="actions"><button type="button" onclick="window.print()">Print trace</button><a href="/">Kirani home</a></div></section>';}catch(error){root.innerHTML='<section class="card"><p class="error">'+esc(error.message)+'</p><p class="meta">Check the QR code or contact Kirani support if this package should have a trace record.</p></section>';}}load();})();
</script>
</body>
</html>
