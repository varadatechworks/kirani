name: Kirani CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kirani
      KIRANI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kirani
      DATABASE_SSL: "false"
      AUTH_JWT_SECRET: ci-kirani-integration-secret-at-least-32-bytes
      AUTH_ISSUER: https://identity.kirani.test/
      AUTH_AUDIENCE: kirani-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kirani
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kirani"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run migrate
      - run: npm run check
